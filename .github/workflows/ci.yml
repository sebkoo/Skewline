name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and test (macOS)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  build-ios:
    name: Build for iOS
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build for iOS
        run: xcodebuild -scheme Skewline-Package -destination 'generic/platform=iOS' build

  readme-drift:
    name: README agrees with the repository
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check
        run: swift Scripts/readme-drift.swift

  fit:
    name: Fit harness tests (Python)
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # One pin, two readers: setup-python reads the same .python-version
      # pyenv reads locally, so the interpreter matches by construction
      # instead of floating with the runner image against an exactly
      # pinned numpy.
      - name: Select Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Toolchain
        run: python3 --version && python3 -m pip --version
      - name: Install
        run: python3 -m venv .venv && .venv/bin/pip install -r Fit/requirements.txt
      - name: Test
        run: .venv/bin/python -m unittest discover -s Fit -v
